<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Energy Flower</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Segoe UI", sans-serif;
  background: #0d1117;
  color: #e6edf3;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 28px 16px 40px;
}

h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 4px; text-align: center; }
.subtitle { font-size: 0.86rem; color: #8b949e; margin-bottom: 24px; text-align: center; }

.controls {
  display: flex;
  gap: 16px;
  margin-bottom: 28px;
  flex-wrap: wrap;
  justify-content: center;
}
.control-group { display: flex; flex-direction: column; gap: 5px; }
label { font-size: 0.75rem; font-weight: 600; color: #8b949e; text-transform: uppercase; letter-spacing: 0.05em; }
select {
  padding: 8px 14px;
  border: 1.5px solid #30363d;
  border-radius: 8px;
  font-size: 0.92rem;
  color: #e6edf3;
  background: #161b22;
  cursor: pointer;
}
select:focus { outline: none; border-color: #2ecc71; }

.flower-wrap {
  position: relative;
  width: 420px;
  height: 420px;
  margin-bottom: 20px;
}
canvas#flowerCanvas {
  width: 420px;
  height: 420px;
  display: block;
}

/* tooltip */
.tooltip {
  position: absolute;
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 0.8rem;
  pointer-events: none;
  display: none;
  z-index: 10;
  min-width: 140px;
}
.tooltip strong { color: #e6edf3; display: block; margin-bottom: 3px; font-size: 0.88rem; }
.tooltip span { color: #8b949e; }

/* stat cards below */
.stats {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
  max-width: 500px;
  margin-bottom: 16px;
}
.stat {
  background: #161b22;
  border: 1.5px solid #30363d;
  border-radius: 10px;
  padding: 12px 16px;
  text-align: center;
  min-width: 90px;
}
.stat-val { font-size: 1.3rem; font-weight: 700; }
.stat-lbl { font-size: 0.7rem; color: #8b949e; margin-top: 2px; }

/* legend */
.legend {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 4px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 0.76rem;
  color: #8b949e;
}
.legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

.comparison {
  font-size: 0.8rem;
  color: #8b949e;
  margin-top: 12px;
  text-align: center;
  max-width: 400px;
  line-height: 1.6;
}
.comparison strong { color: #e6edf3; }
</style>
</head>
<body>

<h2>🌸 Europe's Energy Flowers</h2>
<p class="subtitle">Each petal tells a different story about a country's energy and climate profile</p>

<div class="controls">
  <div class="control-group">
    <label>Country</label>
    <select id="countrySelect"></select>
  </div>
  <div class="control-group">
    <label>Year</label>
    <select id="yearSelect"></select>
  </div>
</div>

<div class="flower-wrap">
  <canvas id="flowerCanvas" width="840" height="840"></canvas>
  <div class="tooltip" id="tooltip"></div>
</div>

<div class="stats" id="statCards"></div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#2ecc71"></div>Renewable share</div>
  <div class="legend-item"><div class="legend-dot" style="background:#e74c3c"></div>CO₂ per capita</div>
  <div class="legend-item"><div class="legend-dot" style="background:#636363"></div>Fossil share</div>
  <div class="legend-item"><div class="legend-dot" style="background:#9b59b6"></div>Total GHG</div>
  <div class="legend-item"><div class="legend-dot" style="background:#f39c12"></div>CO₂ intensity</div>
</div>

<div class="comparison" id="compBox"></div>

const DATA  = PAYLOAD.data;
const MAXV  = PAYLOAD.max;

const PETALS = [
  { key: 'ren',          label: 'Renewable Share',   unit: '%',    color: '#2ecc71', good: true  },
  { key: 'co2',          label: 'CO₂ per capita',    unit: 't',    color: '#e74c3c', good: false },
  { key: 'fos',          label: 'Fossil Share',       unit: '%',    color: '#636363', good: false },
  { key: 'total_ghg',    label: 'Total GHG',          unit: 'Mt',   color: '#9b59b6', good: false },
  { key: 'co2_intensity',label: 'CO₂ Intensity',      unit: 'kg/toe',color: '#f39c12', good: false },
];

const N = PETALS.length;
const countrySelect = document.getElementById('countrySelect');
const yearSelect    = document.getElementById('yearSelect');
const canvas        = document.getElementById('flowerCanvas');
const ctx           = canvas.getContext('2d');
const tooltip       = document.getElementById('tooltip');
const statCards     = document.getElementById('statCards');
const compBox       = document.getElementById('compBox');

// populate country dropdown
Object.keys(DATA).sort().forEach(c => {
  const o = document.createElement('option');
  o.value = o.textContent = c;
  if (c === 'Germany') o.selected = true;
  countrySelect.appendChild(o);
});

// populate year dropdown
const allYears = [...new Set(
  Object.values(DATA).flatMap(c => Object.keys(c).map(Number))
)].sort((a,b)=>a-b);
allYears.forEach(y => {
  const o = document.createElement('option');
  o.value = o.textContent = y;
  if (y === 2024) o.selected = true;
  yearSelect.appendChild(o);
});

// ── draw ───────────────────────────────────────────────────
const SIZE = 840;
const CX   = SIZE / 2;
const CY   = SIZE / 2;
const MAX_R = SIZE * 0.38;
const MIN_R = SIZE * 0.06;

let petalRects = []; // for hover detection

function getNorm(key, val) {
  if (val == null) return 0;
  // for renewable: higher = bigger petal (good)
  // for others:    higher = bigger petal (bad — shows the problem)
  return Math.min(val / MAXV[key], 1);
}

function drawPetal(cx, cy, angle, r, color, alpha, label) {
  // petal shape: two bezier curves forming a leaf
  const tipX = cx + Math.cos(angle) * r;
  const tipY = cy + Math.sin(angle) * r;

  const spread = r * 0.38;
  const cp1x = cx + Math.cos(angle - 0.7) * r * 0.6 + Math.cos(angle + Math.PI/2) * spread;
  const cp1y = cy + Math.sin(angle - 0.7) * r * 0.6 + Math.sin(angle + Math.PI/2) * spread;
  const cp2x = cx + Math.cos(angle + 0.7) * r * 0.6 - Math.cos(angle + Math.PI/2) * spread;
  const cp2y = cy + Math.sin(angle + 0.7) * r * 0.6 - Math.sin(angle + Math.PI/2) * spread;

  ctx.save();
  ctx.globalAlpha = alpha;

  // glow
  ctx.shadowColor = color;
  ctx.shadowBlur  = 18;

  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.bezierCurveTo(cp1x, cp1y, tipX, tipY, tipX, tipY);
  ctx.bezierCurveTo(tipX, tipY, cp2x, cp2y, cx, cy);
  ctx.closePath();

  // gradient fill
  const grad = ctx.createRadialGradient(cx, cy, MIN_R*0.5, tipX, tipY, r*0.1);
  grad.addColorStop(0, color + 'cc');
  grad.addColorStop(1, color + '44');
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.shadowBlur = 0;
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.restore();

  // bounding rect for hover (approximate)
  return {
    cx: tipX, cy: tipY,
    r: Math.abs(r * 0.25),
    label, color
  };
}

function draw(country, year) {
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = SIZE * dpr;
  canvas.height = SIZE * dpr;
  canvas.style.width  = (SIZE/2) + 'px';
  canvas.style.height = (SIZE/2) + 'px';
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, SIZE, SIZE);

  const d = DATA[country]?.[year];
  petalRects = [];

  // background circle
  ctx.beginPath();
  ctx.arc(CX, CY, MAX_R + 10, 0, Math.PI*2);
  ctx.fillStyle = '#161b22';
  ctx.fill();

  // reference rings
  for (let r = 0.25; r <= 1; r += 0.25) {
    ctx.beginPath();
    ctx.arc(CX, CY, MIN_R + (MAX_R - MIN_R) * r, 0, Math.PI*2);
    ctx.strokeStyle = '#30363d';
    ctx.lineWidth = 1;
    ctx.setLineDash([4,4]);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // axes
  PETALS.forEach((p, i) => {
    const angle = (i / N) * Math.PI * 2 - Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(CX + Math.cos(angle)*MIN_R, CY + Math.sin(angle)*MIN_R);
    ctx.lineTo(CX + Math.cos(angle)*MAX_R, CY + Math.sin(angle)*MAX_R);
    ctx.strokeStyle = '#30363d';
    ctx.lineWidth = 1;
    ctx.stroke();

    // axis label
    const lx = CX + Math.cos(angle) * (MAX_R + 28);
    const ly = CY + Math.sin(angle) * (MAX_R + 28);
    ctx.fillStyle = p.color;
    ctx.font = 'bold 22px Segoe UI';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.label, lx, ly);
  });

  if (!d) {
    ctx.fillStyle = '#8b949e';
    ctx.font = '28px Segoe UI';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('No data available', CX, CY);
    return;
  }

  // draw petals
  PETALS.forEach((p, i) => {
    const angle = (i / N) * Math.PI * 2 - Math.PI / 2;
    const norm  = getNorm(p.key, d[p.key]);
    const r     = MIN_R + (MAX_R - MIN_R) * norm;
    const rect  = drawPetal(CX, CY, angle, r, p.color, 0.9,
                            p.label + ': ' + (d[p.key] != null ? d[p.key] + ' ' + p.unit : 'N/A'));
    petalRects.push(rect);
  });

  // polygon overlay connecting petal tips
  ctx.beginPath();
  PETALS.forEach((p, i) => {
    const angle = (i / N) * Math.PI * 2 - Math.PI / 2;
    const norm  = getNorm(p.key, d[p.key]);
    const r     = MIN_R + (MAX_R - MIN_R) * norm;
    const tx    = CX + Math.cos(angle) * r;
    const ty    = CY + Math.sin(angle) * r;
    if (i === 0) ctx.moveTo(tx, ty); else ctx.lineTo(tx, ty);
  });
  ctx.closePath();
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth   = 1.5;
  ctx.stroke();

  // centre
  const centerGrad = ctx.createRadialGradient(CX, CY, 0, CX, CY, MIN_R*0.9);
  centerGrad.addColorStop(0, '#2ecc71');
  centerGrad.addColorStop(1, '#0d1117');
  ctx.beginPath();
  ctx.arc(CX, CY, MIN_R * 0.9, 0, Math.PI*2);
  ctx.fillStyle = centerGrad;
  ctx.fill();

  // stat cards
  statCards.innerHTML = '';
  PETALS.forEach(p => {
    const val = d[p.key];
    const card = document.createElement('div');
    card.className = 'stat';
    card.innerHTML = `
      <div class="stat-val" style="color:${p.color}">${val != null ? val + ' ' + p.unit : '—'}</div>
      <div class="stat-lbl">${p.label}</div>`;
    statCards.appendChild(card);
  });

  // comparison text
  const euRen2024 = 24.5; // approximate EU average 2024
  const euCO2  = 5.4;
  const renDiff = d.ren != null ? (d.ren - euRen2024).toFixed(1) : null;
  const co2Diff = d.co2 != null ? (d.co2 - euCO2).toFixed(1) : null;
  compBox.innerHTML = renDiff != null
    ? `<strong>${country}</strong> in ${year}: renewable share is
       <strong style="color:${renDiff>=0?'#2ecc71':'#e74c3c'}">${renDiff>=0?'+':''}${renDiff}pp</strong>
       vs EU average (≈${euRen2024}%) &nbsp;·&nbsp;
       CO₂ per capita is
       <strong style="color:${co2Diff<=0?'#2ecc71':'#e74c3c'}">${co2Diff>=0?'+':''}${co2Diff}t</strong>
       vs EU average (≈${euCO2}t)`
    : '';
}

// ── hover tooltip ──────────────────────────────────────────
canvas.addEventListener('mousemove', e => {
  const rect  = canvas.getBoundingClientRect();
  // scale mouse coords to canvas coordinate space
  const scaleX = (SIZE/2) / rect.width;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top)  * scaleX;

  let found = null;
  petalRects.forEach(pr => {
    const dx = mx - pr.cx / 2;
    const dy = my - pr.cy / 2;
    if (Math.sqrt(dx*dx+dy*dy) < pr.r / 2 + 20) found = pr;
  });

  if (found) {
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX - rect.left + 12) + 'px';
    tooltip.style.top  = (e.clientY - rect.top  - 10) + 'px';
    tooltip.innerHTML  = `<strong style="color:${found.color}">${found.label}</strong>`;
  } else {
    tooltip.style.display = 'none';
  }
});
