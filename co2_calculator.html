<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CO₂ Country Explorer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      padding: 30px 16px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 32px;
      max-width: 620px;
      width: 100%;
    }

    h2 {
      font-size: 1.3rem;
      color: #1a1a2e;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 24px;
    }

    .controls {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      min-width: 160px;
    }

    label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #444;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    select {
      padding: 10px 14px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #1a1a2e;
      background: #fafafa;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    select:focus {
      outline: none;
      border-color: #4a90d9;
    }

    .results {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat {
      background: #f8fafd;
      border-radius: 12px;
      padding: 18px 14px;
      text-align: center;
      border: 1.5px solid #e8edf5;
      transition: transform 0.2s;
    }

    .stat:hover { transform: translateY(-2px); }

    .stat-value {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 0.75rem;
      color: #777;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .stat.co2 .stat-value  { color: #e74c3c; }
    .stat.ren .stat-value  { color: #27ae60; }
    .stat.fos .stat-value  { color: #7f8c8d; }

    /* bar chart */
    .bar-section { margin-bottom: 20px; }

    .bar-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      color: #555;
      margin-bottom: 5px;
    }

    .bar-track {
      height: 12px;
      background: #eee;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .bar-fill {
      height: 100%;
      border-radius: 6px;
      transition: width 0.6s ease;
    }

    .bar-fill.ren { background: linear-gradient(90deg, #27ae60, #2ecc71); }
    .bar-fill.fos { background: linear-gradient(90deg, #7f8c8d, #95a5a6); }

    /* trend mini chart */
    .trend-section { margin-top: 8px; }

    .trend-title {
      font-size: 0.82rem;
      color: #555;
      margin-bottom: 8px;
      font-weight: 600;
    }

    canvas {
      width: 100%;
      height: 90px;
      display: block;
    }

    .context {
      font-size: 0.82rem;
      color: #666;
      background: #f0f4f8;
      border-radius: 8px;
      padding: 12px 14px;
      line-height: 1.5;
      margin-top: 16px;
    }

    .context strong { color: #1a1a2e; }

    .no-data {
      text-align: center;
      color: #aaa;
      font-size: 0.9rem;
      padding: 20px;
    }
  </style>
</head>
<body>
<div class="card">
  <h2>🌍 Country Energy & CO₂ Explorer</h2>
  <p class="subtitle">Select a country and year to explore its energy profile and CO₂ emissions</p>

  <div class="controls">
    <div class="control-group">
      <label>Country</label>
      <select id="countrySelect"></select>
    </div>
    <div class="control-group">
      <label>Year</label>
      <select id="yearSelect"></select>
    </div>
  </div>

  <div id="output">
    <div class="results">
      <div class="stat co2">
        <div class="stat-value" id="co2Val">—</div>
        <div class="stat-label">CO₂ per capita (t)</div>
      </div>
      <div class="stat ren">
        <div class="stat-value" id="renVal">—</div>
        <div class="stat-label">Renewable share</div>
      </div>
      <div class="stat fos">
        <div class="stat-value" id="fosVal">—</div>
        <div class="stat-label">Fossil share</div>
      </div>
    </div>

    <div class="bar-section">
      <div class="bar-label">
        <span>🌿 Renewables</span>
        <span id="renPct">—</span>
      </div>
      <div class="bar-track"><div class="bar-fill ren" id="renBar" style="width:0%"></div></div>

      <div class="bar-label">
        <span>⛽ Fossils</span>
        <span id="fosPct">—</span>
      </div>
      <div class="bar-track"><div class="bar-fill fos" id="fosBar" style="width:0%"></div></div>
    </div>

    <div class="trend-section">
      <div class="trend-title">CO₂ per capita trend (all available years)</div>
      <canvas id="trendChart"></canvas>
    </div>

    <div class="context" id="contextBox"></div>
  </div>
</div>

  opt.value = opt.textContent = c;

  if (y === 2024) opt.selected = true;
  yearSelect.appendChild(opt);

function update() {
  const country = countrySelect.value;
  const year    = parseInt(yearSelect.value);
  const d       = RAW[country]?.[year];

  if (!d) {
    document.getElementById('co2Val').textContent = '—';
    document.getElementById('renVal').textContent = '—';
    document.getElementById('fosVal').textContent = '—';
    document.getElementById('renBar').style.width = '0%';
    document.getElementById('fosBar').style.width = '0%';
    document.getElementById('contextBox').textContent = 'No data available for this country/year combination.';
    return;
  }

  // stats
  document.getElementById('co2Val').textContent = d.co2 + 't';
  document.getElementById('renVal').textContent = d.ren + '%';
  document.getElementById('fosVal').textContent = d.fos + '%';
  document.getElementById('renPct').textContent = d.ren + '%';
  document.getElementById('fosPct').textContent = d.fos + '%';
  document.getElementById('renBar').style.width = Math.min(d.ren, 100) + '%';
  document.getElementById('fosBar').style.width = Math.min(d.fos, 100) + '%';

  // context text
  const euAvg = EU_AVG[year] || EU_AVG[2024];
  const diff  = (d.co2 - euAvg).toFixed(1);
  const rel   = d.co2 < euAvg
    ? `<strong>${Math.abs(diff)}t below</strong> the European average`
    : `<strong>${diff}t above</strong> the European average`;
  const renDesc = d.ren > 30 ? 'a renewable energy leader' :
                  d.ren > 15 ? 'making progress on renewables' : 'still heavily fossil-dependent';

  document.getElementById('contextBox').innerHTML =
    `In ${year}, <strong>${country}</strong> emitted <strong>${d.co2} tonnes</strong> of CO₂ per person — ${rel} (≈${euAvg}t). ` +
    `With ${d.ren}% of its energy from renewables, it is considered ${renDesc}.`;

  // trend sparkline
  drawTrend(country);
}

function drawTrend(country) {
  const canvas = document.getElementById('trendChart');
  const ctx    = canvas.getContext('2d');
  const dpr    = window.devicePixelRatio || 1;
  const W      = canvas.parentElement.clientWidth;
  const H      = 90;
  canvas.width  = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);

  const entries = Object.entries(RAW[country] || {})
    .map(([y, v]) => ({ y: +y, v: v.co2 }))
    .filter(e => e.v != null)
    .sort((a, b) => a.y - b.y);

  if (entries.length < 2) return;

  const minY = Math.min(...entries.map(e => e.v));
  const maxY = Math.max(...entries.map(e => e.v));
  const pad  = { t: 10, b: 20, l: 36, r: 10 };
  const gW   = W - pad.l - pad.r;
  const gH   = H - pad.t - pad.b;

  const xScale = i => pad.l + (i / (entries.length - 1)) * gW;
  const yScale = v => pad.t + gH - ((v - minY) / (maxY - minY || 1)) * gH;

  // gradient fill
  const grad = ctx.createLinearGradient(0, pad.t, 0, pad.t + gH);
  grad.addColorStop(0, 'rgba(231,76,60,0.25)');
  grad.addColorStop(1, 'rgba(231,76,60,0.0)');

  ctx.beginPath();
  ctx.moveTo(xScale(0), yScale(entries[0].v));
  entries.forEach((e, i) => ctx.lineTo(xScale(i), yScale(e.v)));
  ctx.lineTo(xScale(entries.length - 1), pad.t + gH);
  ctx.lineTo(xScale(0), pad.t + gH);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // line
  ctx.beginPath();
  ctx.moveTo(xScale(0), yScale(entries[0].v));
  entries.forEach((e, i) => ctx.lineTo(xScale(i), yScale(e.v)));
  ctx.strokeStyle = '#e74c3c';
  ctx.lineWidth   = 2;
  ctx.lineJoin    = 'round';
  ctx.stroke();

  // selected year dot
  const selYear = parseInt(yearSelect.value);
  const selIdx  = entries.findIndex(e => e.y === selYear);
  if (selIdx >= 0) {
    ctx.beginPath();
    ctx.arc(xScale(selIdx), yScale(entries[selIdx].v), 5, 0, Math.PI * 2);
    ctx.fillStyle   = '#e74c3c';
    ctx.strokeStyle = '#fff';
    ctx.lineWidth   = 2;
    ctx.fill();
    ctx.stroke();
  }

  // y-axis labels
  ctx.fillStyle  = '#999';
  ctx.font       = '10px sans-serif';
  ctx.textAlign  = 'right';
  ctx.fillText(maxY.toFixed(1), pad.l - 4, pad.t + 4);
  ctx.fillText(minY.toFixed(1), pad.l - 4, pad.t + gH);

  // x-axis labels (first and last year)
  ctx.textAlign = 'left';
  ctx.fillText(entries[0].y, pad.l, H - 4);
  ctx.textAlign = 'right';
  ctx.fillText(entries[entries.length - 1].y, W - pad.r, H - 4);
}

countrySelect.addEventListener('change', update);
yearSelect.addEventListener('change', update);
window.addEventListener('resize', () => drawTrend(countrySelect.value));

update();
</script>
</body>
</html>
