<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Renewable Energy Race</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", sans-serif;
      background: #0d1117;
      color: #e6edf3;
      padding: 24px 16px;
      min-height: 100vh;
    }
    .wrapper { max-width: 760px; margin: 0 auto; }
    .header { margin-bottom: 20px; }
    .header h2 { font-size: 1.4rem; font-weight: 700; margin-bottom: 4px; }
    .header p { font-size: 0.88rem; color: #8b949e; }

    .chart-wrapper {
      position: relative;
      margin-bottom: 16px;
      height: 540px;
    }

    .year-display {
      font-size: 5rem;
      font-weight: 900;
      color: #ffffff10;
      position: absolute;
      right: 0;
      top: 0;
      line-height: 1;
      pointer-events: none;
      user-select: none;
    }

    /* each bar row is absolutely positioned so it can animate vertically */
    .bar-row {
      position: absolute;
      left: 0; right: 0;
      display: flex;
      align-items: center;
      height: 32px;
      transition: top 0.45s cubic-bezier(0.4,0,0.2,1);
    }

    .rank {
      width: 22px;
      font-size: 0.72rem;
      color: #8b949e;
      text-align: right;
      margin-right: 6px;
      flex-shrink: 0;
    }

    .country-name {
      width: 130px;
      font-size: 0.82rem;
      text-align: right;
      margin-right: 10px;
      flex-shrink: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #e6edf3;
    }

    .bar-container {
      flex: 1;
      background: #ffffff0d;
      border-radius: 4px;
      height: 26px;
      overflow: hidden;
      position: relative;
    }

    .bar-fill {
      height: 100%;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 6px;
      min-width: 2px;
      /* width transitions handled by JS requestAnimationFrame */
    }

    .bar-value {
      font-size: 0.75rem;
      font-weight: 700;
      color: rgba(255,255,255,0.9);
      white-space: nowrap;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    button {
      padding: 8px 20px;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    #playBtn { background: #238636; color: #fff; }
    #playBtn:hover { background: #2ea043; }
    #resetBtn { background: #21262d; color: #e6edf3; border: 1px solid #30363d; }
    #resetBtn:hover { background: #30363d; }

    .speed-label { font-size: 0.82rem; color: #8b949e; }
    input[type=range] { width: 100px; accent-color: #238636; }

    .year-pill {
      background: #238636;
      color: #fff;
      padding: 4px 14px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.95rem;
      margin-left: auto;
    }

    .progress-bar {
      height: 3px;
      background: #21262d;
      border-radius: 2px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #238636;
      border-radius: 2px;
      transition: width 0.4s ease;
    }

    .footnote { font-size: 0.75rem; color: #8b949e; margin-top: 12px; }
  </style>
</head>
<body>
<div class="wrapper">
  <div class="header">
    <h2>🏁 The Renewable Energy Race</h2>
    <p>Which European countries are winning the shift from fossil fuels to renewables? (1990–2024)</p>
  </div>

  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="chart-wrapper" id="chartWrapper">
    <div class="year-display" id="yearDisplay">1990</div>
    <div id="chart" style="position:relative;width:100%;height:100%;"></div>
  </div>

  <div class="controls">
    <button id="playBtn">&#9654; Play</button>
    <button id="resetBtn">&#8635; Reset</button>
    <span class="speed-label">Speed</span>
    <input type="range" id="speedSlider" min="1" max="5" value="3"/>
    <div class="year-pill" id="yearPill">1990</div>
  </div>
  <p class="footnote">Data: Eurostat NRG_BAL_S + Our World in Data &middot; Renewable share = renewables &amp; biofuels as % of gross available energy</p>
</div>

const COLORS = {"Iceland": "#2ecc71", "Norway": "#27ae60", "Sweden": "#1abc9c", "Latvia": "#16a085", "Finland": "#3498db", "Denmark": "#2980b9", "Austria": "#9b59b6", "Albania": "#8e44ad", "Portugal": "#e74c3c", "Lithuania": "#c0392b", "Croatia": "#e67e22", "Romania": "#d35400", "Montenegro": "#f39c12", "Estonia": "#f1c40f", "Bosnia and Herzegovina": "#95a5a6", "France": "#2c3e50", "Slovakia": "#7f8c8d", "Slovenia": "#bdc3c7", "Spain": "#e8daef", "Bulgaria": "#fadbd8", "Moldova": "#fdebd0", "Georgia": "#d5f5e3", "Germany": "#d6eaf8", "Italy": "#fdfefe", "Greece": "#f9ebea", "Hungary": "#eaf2ff", "United Kingdom": "#4a235a", "Czechia": "#1a5276", "Serbia": "#117a65", "Poland": "#7d6608", "Ukraine": "#6e2f1a", "Netherlands": "#0e6655", "Ireland": "#1d8348", "Belgium": "#7b241c", "Cyprus": "#6c3483", "Malta": "#922b21", "North Macedonia": "#1f618d", "Luxembourg": "#154360"};
const DEFAULT_COLOR = '#4a90d9';
const TOP_N  = 15;
const ROW_H  = 36; // px per row

const years = Object.keys(DATA).map(Number).sort((a,b)=>a-b);

// ── state ──────────────────────────────────────────────────
let currentIdx = 0;
let playing    = false;
let rafId      = null;
let lastTime   = null;

// interpolation targets (per country)
// currentValues[country] = current animated value
const currentValues = {};

// initialise all countries to their 1990 value (or 0)
for (const country of new Set(years.flatMap(y => DATA[y].map(d=>d.c)))) {
  const first = DATA[years[0]].find(d=>d.c===country);
  currentValues[country] = first ? first.v : 0;
}

// ── DOM refs ───────────────────────────────────────────────
const chart        = document.getElementById('chart');
const yearDisplay  = document.getElementById('yearDisplay');
const yearPill     = document.getElementById('yearPill');
const progressFill = document.getElementById('progressFill');
const playBtn      = document.getElementById('playBtn');
const resetBtn     = document.getElementById('resetBtn');
const speedSlider  = document.getElementById('speedSlider');

// ── build persistent row elements (one per country) ────────
const allCountries = [...new Set(years.flatMap(y => DATA[y].map(d=>d.c)))];
const rowEls = {};

allCountries.forEach(country => {
  const row = document.createElement('div');
  row.className = 'bar-row';
  row.innerHTML = `
    <div class="rank"></div>
    <div class="country-name">${country}</div>
    <div class="bar-container">
      <div class="bar-fill" style="background:${COLORS[country]||DEFAULT_COLOR}">
        <span class="bar-value"></span>
      </div>
    </div>`;
  chart.appendChild(row);
  rowEls[country] = row;
});

// ── animation loop ─────────────────────────────────────────
// each "frame" we interpolate currentValues toward the target year's values
// then re-sort and position rows

function getTargetValues(idx) {
  const yr   = years[Math.min(idx, years.length-1)];
  const map  = {};
  DATA[yr].forEach(d => map[d.c] = d.v);
  return map;
}

function getFrameDuration() {
  // ms between year ticks (how long we spend on each year)
  return [1800, 1200, 800, 500, 300][parseInt(speedSlider.value)-1];
}

function lerp(a, b, t) { return a + (b-a)*t; }

let targetIdx  = 0;   // the year we are animating TOWARD
let tickStart  = null; // when did the current tick start

function animate(ts) {
  if (!lastTime) lastTime = ts;
  if (!tickStart) tickStart = ts;

  const frameDur = getFrameDuration();
  const elapsed  = ts - tickStart;
  const t        = Math.min(elapsed / frameDur, 1); // 0..1

  const targets = getTargetValues(targetIdx);

  // lerp all country values toward targets
  allCountries.forEach(c => {
    const target = targets[c] !== undefined ? targets[c] : 0;
    currentValues[c] = lerp(currentValues[c], target, t * 0.12 + 0.01);
    // using exponential approach: feels elastic and smooth
  });

  // when t reaches 1, snap and advance year
  if (elapsed >= frameDur) {
    // snap exactly
    allCountries.forEach(c => {
      currentValues[c] = targets[c] !== undefined ? targets[c] : currentValues[c];
    });
    tickStart = ts;
    if (targetIdx < years.length - 1) {
      targetIdx++;
    } else {
      // finished
      playing = false;
      playBtn.innerHTML = '&#9654; Play';
      renderFrame();
      return;
    }
  }

  renderFrame();
  lastTime = ts;
  if (playing) rafId = requestAnimationFrame(animate);
}

function renderFrame() {
  // sort countries by current animated value
  const sorted = allCountries
    .map(c => ({ c, v: currentValues[c] }))
    .sort((a,b) => b.v - a.v)
    .slice(0, TOP_N);

  const maxVal = sorted[0].v || 1;
  const yr = years[targetIdx];

  yearDisplay.textContent = yr;
  yearPill.textContent    = yr;
  progressFill.style.width = ((targetIdx / (years.length-1))*100) + '%';

  sorted.forEach((entry, i) => {
    const row   = rowEls[entry.c];
    if (!row) return;
    const rankEl = row.querySelector('.rank');
    const barEl  = row.querySelector('.bar-fill');
    const valEl  = row.querySelector('.bar-value');

    row.style.top     = (i * ROW_H) + 'px';
    row.style.opacity = '1';
    rankEl.textContent = i + 1;
    barEl.style.width  = ((entry.v / maxVal) * 100).toFixed(2) + '%';
    valEl.textContent  = entry.v.toFixed(1) + '%';
  });

  // hide countries not in top N
  allCountries.forEach(c => {
    if (!sorted.find(s=>s.c===c)) {
      rowEls[c].style.opacity = '0';
    }
  });
}

// ── controls ───────────────────────────────────────────────
function startPlay() {
  if (targetIdx >= years.length - 1) {
    targetIdx = 0;
    allCountries.forEach(c => { currentValues[c] = 0; });
  }
  playing   = true;
  tickStart = null;
  lastTime  = null;
  playBtn.innerHTML = '&#9646;&#9646; Pause';
  rafId = requestAnimationFrame(animate);
}

function pausePlay() {
  playing = false;
  cancelAnimationFrame(rafId);
  playBtn.innerHTML = '&#9654; Play';
}

playBtn.addEventListener('click', () => {
  if (playing) pausePlay(); else startPlay();
});

resetBtn.addEventListener('click', () => {
  pausePlay();
  targetIdx = 0;
  tickStart = null;
  allCountries.forEach(c => {
    const first = DATA[years[0]].find(d=>d.c===c);
    currentValues[c] = first ? first.v : 0;
  });
  renderFrame();
});

// initial render
renderFrame();
</script>
